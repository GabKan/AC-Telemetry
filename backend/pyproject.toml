[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "my-fastapi-app"
version = "0.1.0"
dependencies = [
    "alembic==1.19.1",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "click==8.4.2",
    "exceptiongroup==1.3.1",
    "fastapi==0.141.1",
    "git-filter-repo==2.47.0",
    "greenlet==3.5.5",
    "h11==0.16.0",
    "httptools==0.8.0",
    "idna==3.19",
    "Mako==1.4.1",
    "MarkupSafe==3.0.3",
    "psycopg==3.3.4",
    "psycopg-binary==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pydantic_core==2.46.4",
    "python-dotenv==1.2.3",
    "PyYAML==6.0.3",
    "SQLAlchemy==2.0.52",
    "sqlmodel==0.0.39",
    "starlette==1.6.0",
    "tomli==2.4.1",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "uvicorn==0.52.4",
    "watchfiles==1.2.0",
    "websockets==16.1.1",
]

# Explicitly tell setuptools to only discover the 'app' directory (fixes your build error)
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# Configure Pyright for Nvim LSP
[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = "venv"
extraPaths = [".", "venv/lib/python3.11/site-packages"]
executionEnvironments = [
  { root = "." }
]
# pythonExecutable = "./venv/bin/python"
